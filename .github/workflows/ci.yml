name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, test, and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts && npm rebuild node-pty --foreground-scripts
      - run: npm run check
      - run: npm test
      - run: npm run build

  production-image:
    name: Build, smoke-test, and publish image
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      IMAGE_NAME: ghcr.io/bebaek/nookframe
      TEST_IMAGE: nookframe-smoke:${{ github.sha }}
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install smoke-test dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty --foreground-scripts
          npx playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image once
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=nookframe
          cache-to: type=gha,mode=max,scope=nookframe
      - run: npm run test:container
      - run: npm run test:mail-container
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the smoke-tested image without rebuilding
        id: publish
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          commit_image="${IMAGE_NAME}:${GITHUB_SHA}"
          docker tag "$TEST_IMAGE" "$commit_image"
          docker push "$commit_image"
          digest="$(docker buildx imagetools inspect "$commit_image" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${commit_image}@${digest}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '### Published image\n\n`%s`\n\nClean-runner verification pending; `main` is promoted only after verification.\n' "$image" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: Verify registry image on a clean runner
    needs: production-image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      TEST_IMAGE: ${{ needs.production-image.outputs.image }}
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install smoke-test dependencies
        run: |
          npm ci --ignore-scripts
          npm rebuild node-pty --foreground-scripts
          npx playwright install --with-deps chromium
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull exact published digest
        run: docker pull "$TEST_IMAGE"
      - run: npm run test:container
      - run: npm run test:mail-container
      - name: Promote verified image to main
        run: |
          set -euo pipefail
          docker tag "$TEST_IMAGE" ghcr.io/bebaek/nookframe:main
          docker push ghcr.io/bebaek/nookframe:main
          printf '### Verified registry image\n\n`%s`\n\nBoth container smoke tests passed after a clean-runner pull. No deployment performed.\n' "$TEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
